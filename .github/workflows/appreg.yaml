name: Test App Registration Creation

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 407533de-29ff-412d-92ce-4e5123edc076
          tenant-id: 4f29a05d-a3a4-4149-933d-46174b55c69b
          allow-no-subscriptions: true
          
      - name: Export App Registration Details     
        env:
         APP1_ID: test
         APP2_ID: GitHubActions-Temi
        run: |
         az ad app show --id "test" \
         --query "{displayName:displayName,appId:appId,requiredResourceAccess:requiredResourceAccess}" \
         --output json > app1.json

         az ad app show --id "GitHubActions-Temi" \
         --query "{displayName:displayName,appId:appId,requiredResourceAccess:requiredResourceAccess}" \
         --output json > app2.json

         echo "==== API PERMISSION DIFFERENCES ===="
         diff app1.json app2.json || true
         
      - name: Create App Registration
        run: |
          az ad app create \
            --display-name "GitHubActions-Temi"

      - name: List App
        run: |
          az ad app list \
            --display-name "GitHubActions-Temi"
