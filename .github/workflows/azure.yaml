name: Azure Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 16a9e79f-a741-4717-a3e4-1bc2ac3f8ff4
          tenant-id: 4f29a05d-a3a4-4149-933d-46174b55c69b
          allow-no-subscriptions: true

      - name: Verify Login
        run: |
          az account show
