name: Azure Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 407533de-29ff-412d-92ce-4e5123edc076
          tenant-id: 4f29a05d-a3a4-4149-933d-46174b55c69b
          subscription-id: 0fa86f0c-b0d4-4c7a-a8f7-a770d2a5ef4e

      - name: Verify Login
        run: |
          az account show
