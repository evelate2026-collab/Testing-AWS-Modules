name: Azure Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 4f6128a4-baf7-4bf6-b488-7b0b1ea69ed8
          tenant-id: 65360235-8c55-428c-9f16-6ab10e6b16cc
          allow-no-subscriptions: true

      - name: Verify Login
        run: |
          az account show
