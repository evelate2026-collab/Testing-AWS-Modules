name: Test App Registration Creation-v1

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: c1f7911b-db5b-44a4-9ca7-d1d2e587a515
          tenant-id: 4f29a05d-a3a4-4149-933d-46174b55c69b
          allow-no-subscriptions: true

      - name: Create App Registration
        run: |
          az ad app create \
            --display-name "GitHubActions-Test-App"

      - name: List App
        run: |
          az ad app list \
            --display-name "GitHubActions-Test-App"
